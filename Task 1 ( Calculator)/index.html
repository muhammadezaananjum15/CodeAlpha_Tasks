<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Calculator:</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="toggle" onclick="toggleMode()">
    <span></span>
  </div>
  <h4 class="title">A Modern Calculator:</h4>

  <div class="calculator">
    <input type="text" id="display" class="screen" disabled>

    <div class="row g-2">
      <div class="col-3"><button class="btn special w-100" onclick="clearAll()">AC</button></div>
      <div class="col-3"><button class="btn math w-100" onclick="squareRoot()">√</button></div>
      <div class="col-3"><button class="btn math w-100" onclick="square()">x²</button></div>
      <div class="col-3"><button class="btn operator w-100" onclick="add('/')">÷</button></div>

      <div class="col-3"><button class="btn w-100" onclick="add('7')">7</button></div>
      <div class="col-3"><button class="btn w-100" onclick="add('8')">8</button></div>
      <div class="col-3"><button class="btn w-100" onclick="add('9')">9</button></div>
      <div class="col-3"><button class="btn operator w-100" onclick="add('*')">×</button></div>

      <div class="col-3"><button class="btn w-100" onclick="add('4')">4</button></div>
      <div class="col-3"><button class="btn w-100" onclick="add('5')">5</button></div>
      <div class="col-3"><button class="btn w-100" onclick="add('6')">6</button></div>
      <div class="col-3"><button class="btn operator w-100" onclick="add('-')">−</button></div>

      <div class="col-3"><button class="btn w-100" onclick="add('1')">1</button></div>
      <div class="col-3"><button class="btn w-100" onclick="add('2')">2</button></div>
      <div class="col-3"><button class="btn w-100" onclick="add('3')">3</button></div>
      <div class="col-3"><button class="btn operator w-100" onclick="add('+')">+</button></div>

      <div class="col-6"><button class="btn w-100" onclick="add('0')">0</button></div>
      <div class="col-3"><button class="btn w-100" onclick="del()">DEL</button></div>
      <div class="col-3"><button class="btn equal w-100" onclick="calculate()">=</button></div>
    </div>
  </div>
</body>
  <script src="./app.js"></script>

</html>
